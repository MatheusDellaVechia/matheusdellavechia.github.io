<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Imagem de destaque">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a" />
      <stop offset="0.55" stop-color="#4338ca" />
      <stop offset="1" stop-color="#059669" />
    </linearGradient>
    <pattern id="sdots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.12" />
    </pattern>
  </defs>
  <rect width="1200" height="500" fill="url(#sbg)" />
